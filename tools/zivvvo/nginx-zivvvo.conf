server {
    server_name www.zivvvo.co.zw zivvvo.co.zw;

    root /var/www/zivvvo/apps/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Paynow API proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3939;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Payment return page (SPA fallback handles this)
    location /payment/ {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # PWA service worker — no cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/www.zivvvo.co.zw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.zivvvo.co.zw/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = zivvvo.co.zw) {
        return 301 https://$host$request_uri;
    }
    if ($host = www.zivvvo.co.zw) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name www.zivvvo.co.zw zivvvo.co.zw;
    return 404;
}
